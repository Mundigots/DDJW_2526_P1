<!DOCTYPE html> 
<html>
	<head>
		<link rel="stylesheet" href="../styles/main.css">
        <script src="../js/optionsMode2.js" type="module"></script>
		<title> Memory - Opcions Mode 2 </title>
	</head>
	<body>
		<h1>Opcions Mode 2</h1>
		<label for="level">Selecciona un nivell</label>
		<select id="level">
			<option value="1">Nivell 1</option>
			<option value="2">Nivell 2</option>
			<option value="3">Nivell 3</option>
			<option value="4">Nivell 4</option>
		</select>
		
		<!-- Dificultat -->
		<label for="difficulty">Dificultat inicial</label>
		<select id="difficulty">
			<option value="easy">Easy</option>
			<option value="normal">Normal</option>
			<option value="hard">Hard</option>
		</select>
		
		<!-- Mida del grup -->
		<label for="groupSize">Mida del grup</label>
		<select id="groupSize">
			<option value="2">Parelles</option>
			<option value="3">Trios</option>
			<option value="4">Quartets</option>
		</select>
			
		<button id="default" class="center">Per defecte</button>		
        <button id="apply" class="center">Aplicar</button>
	</body>
</html>
